<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Batay Royale classement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root { --or: #ffd23f; --or2: #ff9614; --lave: #ff4a10; --fond: #140403; --carte: rgba(40,8,4,.86); --texte: #fff3e6; --doux: #ffcfa8; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Poppins, system-ui, sans-serif; color: var(--texte); background: var(--fond); min-height: 100vh; overflow-x: hidden; }
body::before { content: ""; position: fixed; inset: 0; z-index: -2; background:
  radial-gradient(ellipse 120% 60% at 50% 115%, rgba(255,90,10,.55), transparent 60%),
  radial-gradient(ellipse 80% 40% at 15% 0%, rgba(160,20,0,.45), transparent 70%),
  radial-gradient(ellipse 80% 40% at 90% 10%, rgba(120,10,0,.4), transparent 70%), var(--fond); }
#braises { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
.wrap { max-width: 560px; margin: 0 auto; padding: 18px 14px 40px; }
header { display: flex; align-items: center; gap: 12px; }
header img { width: 108px; height: 108px; object-fit: cover; border-radius: 22px; border: 3px solid var(--or); box-shadow: 0 0 28px rgba(255,90,0,.7); flex: none; }
.sur { font-weight: 800; font-size: 12px; letter-spacing: .14em; color: var(--doux); }
h1 { font-family: Anton, Impact, sans-serif; font-weight: 400; font-size: 46px; line-height: .95; letter-spacing: .01em;
  background: linear-gradient(180deg, #fff6b0 10%, var(--or) 45%, var(--or2) 90%); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 3px 0 #3a0800) drop-shadow(0 0 14px rgba(255,80,0,.55)); }
.tabs { display: flex; gap: 8px; margin: 18px 0 12px; }
.tabs a { flex: 1; text-align: center; text-decoration: none; padding: 11px 8px; border-radius: 14px; font-weight: 800; font-size: 14px; color: var(--doux);
  background: rgba(60,10,4,.8); border: 2px solid rgba(255,140,40,.35); }
.tabs a.on { color: #3a0800; background: linear-gradient(180deg, #ffe680, var(--or2)); border-color: #fff0b0; box-shadow: 0 0 18px rgba(255,150,20,.5); }
.info { text-align: center; font-size: 13px; color: var(--doux); margin-bottom: 10px; }
.chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 18px; }
.chip { background: var(--carte); border: 1px solid rgba(255,140,40,.35); border-radius: 12px; padding: 8px 4px; text-align: center; }
.chip b { display: block; font-size: 18px; color: var(--or); font-variant-numeric: tabular-nums; }
.chip span { font-size: 10.5px; color: var(--doux); }
.podium { display: grid; grid-template-columns: 1fr 1.15fr 1fr; gap: 8px; align-items: end; margin: 26px 0 18px; }
.pod { position: relative; text-align: center; border-radius: 20px; padding: 30px 6px 12px; background: linear-gradient(180deg, rgba(140,24,6,.95), rgba(60,10,4,.95)); border: 3px solid; }
.pod .ic { position: absolute; top: -26px; left: 50%; transform: translateX(-50%); font-size: 40px; filter: drop-shadow(0 3px 6px rgba(0,0,0,.6)); }
.pod .rk { font-family: Anton, Impact, sans-serif; font-size: 34px; line-height: 1; }
.pod .nm { font-weight: 800; font-size: 13.5px; margin: 6px 0 4px; overflow-wrap: anywhere; line-height: 1.2; }
.pod .pt { font-family: Anton, Impact, sans-serif; font-size: 22px; color: var(--or); }
.pod .st { font-size: 11px; color: var(--doux); }
.p1 { border-color: var(--or); padding-top: 40px; box-shadow: 0 0 30px rgba(255,200,40,.45); } .p1 .rk { color: var(--or); font-size: 44px; } .p1 .pt { font-size: 27px; } .p1 .ic { font-size: 50px; top: -32px; }
.p2 { border-color: #e8eef8; } .p2 .rk { color: #e8eef8; }
.p3 { border-color: #ffab70; } .p3 .rk { color: #ffab70; }
.cherche { position: relative; margin-bottom: 10px; }
.cherche input { width: 100%; padding: 13px 14px 13px 42px; border-radius: 14px; border: 2px solid rgba(255,140,40,.45); background: rgba(30,6,3,.9); color: var(--texte); font: 600 15px Poppins, sans-serif; outline: none; }
.cherche input:focus { border-color: var(--or); }
.cherche::before { content: "🔎"; position: absolute; left: 14px; top: 50%; transform: translateY(-50%); }
.liste { display: flex; flex-direction: column; gap: 6px; }
.ligne { display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 10px; padding: 9px 12px 9px 9px; border-radius: 14px; background: var(--carte); border: 1px solid rgba(255,140,40,.28); }
.ligne.moi { border: 2px solid var(--or); box-shadow: 0 0 16px rgba(255,200,40,.45); }
.ligne .n { width: 40px; height: 38px; border-radius: 11px; display: grid; place-items: center; font-family: Anton, Impact, sans-serif; font-size: 19px; background: #a81a00; }
.ligne .nm { font-weight: 800; font-size: 14.5px; overflow-wrap: anywhere; line-height: 1.2; }
.ligne .st { font-size: 11.5px; color: var(--doux); }
.ligne .pt { font-family: Anton, Impact, sans-serif; font-size: 20px; color: var(--or); text-align: right; font-variant-numeric: tabular-nums; }
.ligne .pt small { display: block; font-family: Poppins, sans-serif; font-size: 10px; color: var(--doux); font-weight: 600; }
.bulle { width: 44px; height: 44px; border-radius: 50%; flex: none; display: grid; place-items: center; font: 800 18px Poppins, sans-serif; color: #fff; border: 2px solid var(--or); object-fit: cover; box-shadow: 0 0 10px rgba(255,140,40,.45); }
.pod .bulle { width: 64px; height: 64px; margin: 4px auto 0; font-size: 26px; } .p1 .bulle { width: 78px; height: 78px; font-size: 32px; }
.ligne .who { display: flex; align-items: center; gap: 10px; min-width: 0; } .tt { font-size: 11.5px; color: #ffb27a; font-weight: 600; overflow-wrap: anywhere; }
.vide { text-align: center; color: var(--doux); padding: 20px; }
.plus { display: block; width: 100%; margin-top: 10px; padding: 12px; border-radius: 14px; border: 2px solid rgba(255,140,40,.45); background: rgba(60,10,4,.85); color: var(--or); font: 800 14px Poppins, sans-serif; cursor: pointer; }
footer { margin-top: 26px; text-align: center; }
.cta { display: inline-block; padding: 14px 22px; border-radius: 40px; background: linear-gradient(180deg, #ffe680, var(--or2)); color: #3a0800; font-weight: 800; font-size: 15px; text-decoration: none; border: 3px solid #5a1400; box-shadow: 0 0 24px rgba(255,150,20,.55); }
footer p { margin-top: 12px; font-size: 12px; color: var(--doux); line-height: 1.5; }
.lot { margin: 0 0 14px; padding: 14px; border-radius: 18px; text-align: center; background: linear-gradient(135deg, rgba(60,10,120,.92), rgba(150,30,120,.9)); border: 2px solid #d8a8ff; box-shadow: 0 0 26px rgba(170,80,255,.45); }
.lot .t { font-family: Anton, Impact, sans-serif; font-size: 25px; letter-spacing: .02em; color: #fff; }
.lot .s { font-size: 13px; color: #f2dcff; margin-top: 4px; line-height: 1.4; }
.lot .cd { display: inline-block; margin-top: 8px; padding: 6px 14px; border-radius: 30px; background: rgba(0,0,0,.35); font-weight: 800; font-size: 14px; color: var(--or); font-variant-numeric: tabular-nums; }
.tir { margin: 0 0 14px; padding: 14px; border-radius: 18px; text-align: center; background: linear-gradient(135deg, rgba(120,40,0,.92), rgba(170,20,40,.9)); border: 2px solid #ffc86a; box-shadow: 0 0 22px rgba(255,140,40,.4); }
.tir .t { font-family: Anton, Impact, sans-serif; font-size: 23px; color: #fff; } .tir .s { font-size: 12.5px; color: #ffe6cc; margin-top: 4px; line-height: 1.45; }
.tir .w { display: flex; gap: 8px; margin-top: 10px; } .tir .w > div { flex: 1; background: rgba(0,0,0,.3); border-radius: 12px; padding: 8px 6px; font-size: 12px; color: #ffe6cc; } .tir .w b { display: block; font-size: 14px; color: var(--or); overflow-wrap: anywhere; }
.hc { display: inline-block; margin-left: 4px; padding: 1px 7px; border-radius: 10px; font-size: 10.5px; font-weight: 800; background: rgba(255,210,63,.18); color: var(--or); border: 1px solid rgba(255,210,63,.5); }
.gagnants { margin-top: 18px; } .gagnants h2 { font-family: Anton, Impact, sans-serif; font-weight: 400; font-size: 22px; color: var(--or); margin-bottom: 8px; text-align: center; }
@media (max-width: 380px) { h1 { font-size: 38px; } header img { width: 88px; height: 88px; } .pod .nm { font-size: 12px; } }
</style>
</head>

  const v = vue(), last = DATA.lives[DATA.lives.length - 1]; clearInterval(cdT); $('lot').hidden = v !== 'semaine'; $('tir').hidden = v !== 'semaine'; $('gagnants').hidden = v !== 'semaine';
  if (!last) { $('info').textContent = 'Le classement arrive après le premier live !'; return; }
  if (v === 'semaine') { const dim = dimancheDe(new Date()), deb = new Date(dim); deb.setDate(deb.getDate() - 7);
    const lives = DATA.lives.filter(L => cle(dimancheDe(jour(L.date))) === cle(dim)); rows = cumul(lives).filter(r => !horsC(r));
    $('lot').innerHTML = `<div class="t">🌌 UNE GALAXIE À GAGNER 🌌</div><div class="s">Le n°1 de la semaine reçoit une <b>Galaxie</b> en live le <b>${joli(dim)}</b>.<br>Lives comptés : du ${joli(deb)} au samedi soir.</div><div class="cd" id="cd"></div>`;
    const tick = () => { const fin = new Date(dim); fin.setHours(0, 0, 0, 0); const ms = fin - Date.now(); $('cd') && ($('cd').textContent = ms > 0 ? `⏳ Fin de la semaine dans ${Math.floor(ms / 864e5)} j ${Math.floor(ms / 36e5) % 24} h ${Math.floor(ms / 6e4) % 60} min` : '🎁 Remise de la Galaxie ce soir en live !'); }; tick(); cdT = setInterval(tick, 30000);
    const T = (DATA.tirages || {})[cle(dim)] || {}, nTir = Math.max(0, rows.length - 1), wn = x => x ? `<b>${esc(clean(x.p))}</b>${x.h ? '@' + esc(x.h) : ''}` : '<b>—</b>à venir';
    $('tir').innerHTML = `<div class="t">🎟️ 2 TIRAGES AU SORT · 🔫 1 PISTOLET PAR TIRAGE</div><div class="s">Tous les joueurs de la semaine participent, <b>sauf le n°1</b> (il gagne la Galaxie). Le gagnant du 1er tirage ne participe pas au 2e. Tirages en live le <b>${joli(dim)}</b>.<br>Déjà <b>${nTir}</b> joueur${nTir > 1 ? 's' : ''} dans le tirage cette semaine.</div><div class="w"><div>Tirage n°1${wn(T.t1)}</div><div>Tirage n°2${wn(T.t2)}</div></div>`;
    $('info').textContent = `${lives.length} live${lives.length > 1 ? 's' : ''} cette semaine${DATA.maj ? ' · mis à jour le ' + DATA.maj : ''}`;
    $('chips').innerHTML = chips([[rows.length, 'joueurs'], [lives.length, 'lives'], [fmt(rows.reduce((a, r) => a + r.ko, 0)), 'KO'], [fmt(rows.reduce((a, r) => a + r.c, 0)), 'cœurs ❤️']]);
    const sem = new Map(); for (const L of DATA.lives) { const k = cle(dimancheDe(jour(L.date))); if (k < cle(dim) || (k === cle(dim) && false)) (sem.get(k) || sem.set(k, []).get(k)).push(L); }
    const g = [...sem.entries()].sort((a, b) => b[0].localeCompare(a[0])).map(([k, Ls]) => { const w = cumul(Ls).filter(r => !horsC(r))[0]; return w ? `<div class="ligne"><div class="n">🌌</div><div class="who">${bulle(w)}<div><div class="nm">${esc(clean(w.p))}</div>${tt(w)}<div class="st">Galaxie du ${new Date(k + 'T12:00').toLocaleDateString('fr-FR', { day: 'numeric', month: 'long' })}${(() => { const T = (DATA.tirages || {})[k] || {}; const l = [T.t1, T.t2].filter(Boolean).map(x => '🔫 ' + esc(clean(x.p))); return l.length ? '<br>' + l.join(' · ') : ''; })()}</div></div></div><div class="pt">${fmt(w.pts)}<small>points</small></div></div>` : ''; }).join('');
    $('gagnants').innerHTML = g ? `<h2>🏆 LES GAGNANTS DE LA SEMAINE</h2><div class="liste">${g}</div>` : ''; }
  else if (v === 'live') { rows = last.rows.map(([p, pts, ko, vic, c, h]) => ({ p, h, pts, ko, v: vic, c }));
    $('info').textContent = `Live du ${last.date} · ${last.debut} → ${last.fin}`;
    $('chips').innerHTML = chips([[last.joueurs, 'joueurs'], [last.manches, 'manches'], [fmt(last.coeurs), 'cœurs ❤️'], [last.partages, 'partages']]); }
  else { rows = cumul(DATA.lives); const nb = DATA.lives.length;
    $('info').textContent = `Tous les lives additionnés · ${nb} live${nb > 1 ? 's' : ''} · depuis le ${DATA.lives[0].date}`;
    $('chips').innerHTML = chips([[rows.length, 'joueurs'], [nb, nb > 1 ? 'lives' : 'live'], [fmt(rows.reduce((a, r) => a + r.ko, 0)), 'KO'], [fmt(rows.reduce((a, r) => a + r.c, 0)), 'cœurs ❤️']]); }
  rows.forEach((r, i) => r.rk = i + 1);
  const pod = [[1, 'p2', '🥈'], [0, 'p1', v === 'semaine' ? '🌌' : '👑'], [2, 'p3', '🥉']];
  $('podium').innerHTML = rows.length ? pod.map(([k, cl, ic]) => { const r = rows[k]; if (!r) return '<div></div>'; return `<div class="pod ${cl}"><div class="ic">${ic}</div><div class="rk">#${k + 1}</div>${bulle(r)}<div class="nm">${esc(clean(r.p))}</div>${v === 'general' && horsC(r) ? '<span class="hc">👑 hors concours</span>' : ''}${tt(r)}<div class="pt">${fmt(r.pts)} pts</div><div class="st">⚔️ ${r.ko} KO · ❤️ ${fmt(r.c)}</div></div>`; }).join('') : '';
  liste(); }
function liste() { const v0 = vue(); const q = $('q').value.trim().toLowerCase(); let L = q ? rows.filter(r => clean(r.p).toLowerCase().includes(q) || String(r.h || '').toLowerCase().includes(q.replace(/^@/, ''))) : rows.slice(3);
  const tot = L.length; if (!q) L = L.slice(0, montre);
  $('liste').innerHTML = L.length ? L.map(r => `<div class="ligne${q ? ' moi' : ''}"><div class="n">${r.rk}</div><div class="who">${bulle(r)}<div><div class="nm">${esc(clean(r.p))}${v0 === 'general' && horsC(r) ? '<span class="hc">👑 hors concours</span>' : ''}</div>${tt(r)}<div class="st">⚔️ ${r.ko} KO${r.v ? ` · 🏆 ${r.v} victoire${r.v > 1 ? 's' : ''}` : ''} · ❤️ ${fmt(r.c)}${r.lives > 1 ? ` · ${r.lives} lives` : ''}</div></div></div><div class="pt">${fmt(r.pts)}<small>points</small></div></div>`).join('') : (rows.length ? '<div class="vide">Aucun joueur avec ce pseudo… viens jouer au prochain live ! 🔥</div>' : '<div class="vide">La semaine commence : viens jouer au prochain live pour prendre la 1re place ! 🔥</div>');
  $('plus').hidden = !!q || tot <= montre; }
$('q').addEventListener('input', liste);
$('plus').addEventListener('click', () => { montre = 1e9; liste(); });
window.addEventListener('hashchange', () => { montre = 50; render(); });
fetch('data.json', { cache: 'no-store' }).then(r => r.json()).then(d => { DATA = d; render(); }).catch(() => { $('info').textContent = 'Classement indisponible pour le moment.'; });
// braises
const cv = $('braises'), cx = cv.getContext('2d'); let B = [];
function size() { cv.width = innerWidth; cv.height = innerHeight; B = Array.from({ length: Math.min(70, innerWidth / 8 | 0) }, () => ({ x: Math.random() * cv.width, y: Math.random() * cv.height, r: Math.random() * 2.2 + .6, v: Math.random() * .6 + .2, a: Math.random() })); }
size(); addEventListener('resize', size);
const calme = matchMedia('(prefers-reduced-motion: reduce)').matches;
(function f() { cx.clearRect(0, 0, cv.width, cv.height); for (const p of B) { if (!calme) { p.y -= p.v; p.x += Math.sin(p.y / 40) * .3; if (p.y < -5) { p.y = cv.height + 5; p.x = Math.random() * cv.width; } } cx.fillStyle = `rgba(255,${140 + p.a * 90 | 0},40,${.35 + p.a * .5})`; cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, 7); cx.fill(); } if (!calme) requestAnimationFrame(f); })();
</script>
</body>
